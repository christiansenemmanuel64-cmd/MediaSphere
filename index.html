<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Configuración PWA para Celulares -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos.css">
    <title>Document</title>
</head>
<body>
    <form id="form-recomendacion">
  <!-- Campo Texto -->
  <label for="titulo">Título del contenido:</label>
  <input type="text" id="titulo" name="titulo" required maxlength="100">

  <!-- Campo Select (Categoría) -->
  <label for="tipo_contenido">Tipo de Contenido:</label>
  <select id="tipo_contenido" name="tipo_contenido" required>
    <option value="">-- Selecciona una opción --</option>
    <option value="pelicula">Película</option>
    <option value="serie">Serie</option>
    <option value="anime">Anime</option>
    <option value="videojuego">Videojuego</option>
  </select>

  <!-- Campo Number (Puntuación) -->
  <label for="puntuacion">Puntuación (1 al 5):</label>
  <input type="number" id="puntuacion" name="puntuacion" min="1" max="5" required>

  <!-- Campo URL (Portada) -->
  <label for="url_portada">URL de la Imagen de Portada:</label>
  <input type="url" id="url_portada" name="url_portada" placeholder="https://..." required>

  <!-- Campo Date -->
  <label for="fecha_publicacion">Fecha de publicación:</label>
  <input type="date" id="fecha_publicacion" name="fecha_publicacion" required>

  <!-- Campo Checkbox -->
  <label>
    <input type="checkbox" id="para_mayores" name="para_mayores">
    Contenido para mayores de 18 años
  </label>

  <!-- Campo Textarea (Reseña y Por qué la recomendás) -->
  <label for="motivo_recomendacion">¿Por qué la recomendás?:</label>
  <textarea id="motivo_recomendacion" name="motivo_recomendacion" rows="4" required></textarea>

  <button type="submit">Publicar Recomendación</button>
</form>
</body>
</html>
